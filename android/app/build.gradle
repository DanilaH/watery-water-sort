apply plugin: 'com.android.application'
def analyticsKey = System.getenv('APPMETRICA_API_KEY') ?: ''
if (analyticsKey && !analyticsKey.matches('[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')) throw new GradleException('Invalid analytics API key')
def releaseStore = System.getenv('ANDROID_KEYSTORE_PATH') ?: ''
def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def releaseAlias = System.getenv('ANDROID_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ''
def productionSigning = releaseStore && releasePassword && releaseAlias && releaseKeyPassword
def rewardedUnit = System.getenv('YANDEX_REWARDED_AD_UNIT_ID') ?: ''
def bannerUnit = System.getenv('YANDEX_BANNER_AD_UNIT_ID') ?: ''
def interstitialUnit = System.getenv('YANDEX_INTERSTITIAL_AD_UNIT_ID') ?: ''
for (unit in [bannerUnit, interstitialUnit]) if (unit && !unit.matches('[A-Za-z0-9_-]+')) throw new GradleException('Invalid ad unit id')
if (rewardedUnit && !rewardedUnit.matches('[A-Za-z0-9_-]+')) throw new GradleException('Invalid rewarded ad unit id')

android {
    namespace = "com.danilah.waterywatersort"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.danilah.waterywatersort"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${rewardedUnit}\""
        buildConfigField "String", "BANNER_AD_UNIT_ID", "\"${bannerUnit}\""
        buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"${interstitialUnit}\""
        buildConfigField "String", "ANALYTICS_API_KEY", "\"${analyticsKey}\""
        versionCode 57
        versionName "0.57.0-centered-header"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        production {
            if (productionSigning) {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
        publicPreview {
            storeFile file("../debug-signing/public-test.p12")
            storePassword "android"
            keyAlias "water-preview"
            keyPassword "android"
            storeType "PKCS12"
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "ANALYTICS_API_KEY", '""'
            buildConfigField "String", "REWARDED_AD_UNIT_ID", '"demo-rewarded-yandex"'
            buildConfigField "String", "BANNER_AD_UNIT_ID", '"demo-banner-yandex"'
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", '"demo-interstitial-yandex"'
            applicationIdSuffix ".preview3"
            signingConfig signingConfigs.publicPreview
        }
        release {
            if (productionSigning) signingConfig signingConfigs.production
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.yandex.android:mobileads:8.6.0"
    implementation("io.appmetrica.analytics:analytics:8.6.0") { version { strictly "8.6.0" } }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Manifest/unsigned audits remain possible; production packaging requires real configuration.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path in [':app:assembleRelease', ':app:bundleRelease', ':app:packageRelease', ':app:packageReleaseBundle', ':app:signReleaseBundle'] }) {
        if ([rewardedUnit,bannerUnit,interstitialUnit].any { !it || it.toLowerCase().contains('demo') } || !analyticsKey)
            throw new GradleException('Production IDs are required; use assembleDebug for previews')
        if (!productionSigning) throw new GradleException('Production signing is required')
        def owner = java.security.KeyStore.getInstance(file(releaseStore), releasePassword.toCharArray())
        def preview = java.security.KeyStore.getInstance(file('../debug-signing/public-test.p12'), 'android'.toCharArray())
        def ownerCertificate = owner.getCertificate(releaseAlias)
        if (ownerCertificate == null) throw new GradleException('Production signing alias is missing')
        if (java.util.Arrays.equals(ownerCertificate.publicKey.encoded, preview.getCertificate('water-preview').publicKey.encoded))
            throw new GradleException('Preview signing keys are forbidden in production')
    }
}
