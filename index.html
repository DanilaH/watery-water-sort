<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d32"><title>Переливы</title></head><body>
<div id="app">
<header class="game-header"><button id="menu" aria-label="Открыть меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><h1 id="level-title">Уровень 1</h1></div><button id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1 2h4l1-2 3 2v2l2 3 2 1v3l-2 1-2 3v2l-3 2-1-2h-4l-1 2-3-2v-2l-2-3-2-1v-3l2-1 2-3V5z" transform="translate(1 0) scale(.9)"/></svg></button></header>
<div id="meta"><span id="moves">Ходов: 0</span><button id="symbols"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 9-9 9-9-9z"/><circle cx="12" cy="12" r="3"/></svg><span>Метки</span></button><span id="progress">1 / 12</span></div>
<main id="board" aria-label="Игровое поле"></main>
<div id="feedback"><div><h2 id="finish-title" hidden>Готово!</h2><p id="status" role="status">Выбери цветную колбу, затем пустую</p></div><button id="continue" hidden>Дальше →</button></div>
<nav aria-label="Действия"><button id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h10a6 6 0 1 1 0 12" transform="translate(0 -2)"/></svg><span>Отмена</span></button><button id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5zM20 2v4m-2-2h4"/></svg><span>Подсказка</span></button><button id="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>Заново</span></button></nav>
<div id="banner-slot" aria-hidden="true"></div>
</div><dialog id="dialog"><div id="dialog-content"></div></dialog><script type="module" src="/src/main.ts"></script></body></html>
