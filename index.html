<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b22"><title>Переливы</title></head><body class="home">
<section id="home" aria-label="Главное меню">
 <div class="home-content">
 <svg class="home-mark" viewBox="0 0 100 90" fill="none" aria-hidden="true"><path d="M12 12h18v51a9 9 0 0 1-18 0zM41 5h18v58a9 9 0 0 1-18 0zM70 19h18v44a9 9 0 0 1-18 0z" stroke="currentColor" stroke-width="2"/><path d="M15 43h12v20a6 6 0 0 1-12 0z" fill="#22d9eb"/><path d="M44 27h12v36a6 6 0 0 1-12 0z" fill="#397bff"/><path d="M73 49h12v14a6 6 0 0 1-12 0z" fill="#b75bfa"/></svg>
 <h1>Переливы</h1><p id="home-summary">Собери каждый цвет в свою колбу</p>
 <div class="home-actions"><button id="home-play">Играть</button><button id="home-levels">Выбор уровней</button><button id="home-settings">Настройки</button></div>
 <p id="home-error" role="alert" hidden></p>
 </div>
</section>
<div id="app">
<header class="game-header"><button id="menu" aria-label="Открыть меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><h1 id="level-title">Уровень 1</h1></div><button id="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1 2h4l1-2 3 2v2l2 3 2 1v3l-2 1-2 3v2l-3 2-1-2h-4l-1 2-3-2v-2l-2-3-2-1v-3l2-1 2-3V5z" transform="translate(1 0) scale(.9)"/></svg></button></header>
<div id="meta"><span id="moves">Ходов: 0</span><button id="symbols"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 9-9 9-9-9z"/><circle cx="12" cy="12" r="3"/></svg><span>Метки</span></button><span id="progress">1 / 12</span></div>
<main id="board" aria-label="Игровое поле"><button id="extra-tube" hidden aria-label="Дополнительная колба за рекламу"><svg class="locked-vessel" viewBox="0 0 60 220" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M6 4h48v187a24 24 0 0 1-48 0z" stroke="currentColor" stroke-width="2"/><path d="M7 82l46 50M7 132l46-50" stroke="currentColor" stroke-width="5" stroke-dasharray="6 3" opacity=".75"/><rect x="19" y="100" width="22" height="19" rx="3" fill="currentColor"/><path d="M24 100v-7a6 6 0 0 1 12 0v7" stroke="currentColor" stroke-width="3"/></svg><svg class="reward-video" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="currentColor"/><path d="m10 8 6 4-6 4z" fill="#102b36"/></svg></button></main>
<div id="feedback"><div><div class="result-heading"><h2 id="finish-title" hidden>Готово!</h2><span id="earned-stars" hidden></span></div><p id="status" role="status">Выбери цветную колбу, затем пустую</p><p id="star-target"></p></div><button id="rescue" hidden>Варианты</button><button id="continue" hidden>Дальше →</button></div>
<nav aria-label="Действия"><button id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h10a6 6 0 1 1 0 12" transform="translate(0 -2)"/></svg><span>Отмена</span></button><button id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5zM20 2v4m-2-2h4"/></svg><span>Подсказка</span></button><button id="restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>Заново</span></button></nav>
<div id="banner-slot" aria-hidden="true"></div>
</div><dialog id="dialog"><div id="dialog-content"></div></dialog><script type="module" src="/src/main.ts"></script></body></html>
