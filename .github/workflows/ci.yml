name: Check and Android prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ratings:check
      - run: npm test
      - run: npm run build
      # Ubuntu 24.04 hosted runners already include Chrome runtime libraries.
      # Avoid an unrelated apt mirror outage blocking tests and Android packaging.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
        env:
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: watery-water-sort-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
