name: Check and Android prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ratings:check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: python3 tools/test-native-ads.py --baseline && python3 tools/test-native-ads.py
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew testDebugUnitTest assembleDebug processReleaseMainManifest --no-daemon
        env:
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
      - name: Reject unconfigured production packaging
        working-directory: android
        env:
          YANDEX_REWARDED_AD_UNIT_ID: ''
          APPMETRICA_API_KEY: ''
          YANDEX_BANNER_AD_UNIT_ID: ''
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ''
          ANDROID_KEYSTORE_PATH: ''
          ANDROID_KEYSTORE_PASSWORD: ''
          ANDROID_KEY_ALIAS: ''
          ANDROID_KEY_PASSWORD: ''
        run: |
          if ./gradlew :app:assembleRelease --no-daemon > qa-release-guard.log 2>&1; then
            echo 'Unconfigured release unexpectedly packaged'
            exit 1
          fi
          grep -F 'Production IDs are required' qa-release-guard.log
          if YANDEX_BANNER_AD_UNIT_ID=R-M-config-probe YANDEX_INTERSTITIAL_AD_UNIT_ID=R-M-config-probe YANDEX_REWARDED_AD_UNIT_ID=R-M-config-probe APPMETRICA_API_KEY=00000000-0000-0000-0000-000000000000 ./gradlew :app:assembleRelease --no-daemon > qa-signing-guard.log 2>&1; then
            echo 'Unsigned production packaging unexpectedly passed'
            exit 1
          fi
          grep -F 'Production signing is required' qa-signing-guard.log
          if YANDEX_BANNER_AD_UNIT_ID=R-M-config-probe YANDEX_INTERSTITIAL_AD_UNIT_ID=R-M-config-probe YANDEX_REWARDED_AD_UNIT_ID=R-M-config-probe APPMETRICA_API_KEY=00000000-0000-0000-0000-000000000000 ANDROID_KEYSTORE_PATH=../debug-signing/public-test.p12 ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_ALIAS=water-preview ANDROID_KEY_PASSWORD=android ./gradlew :app:packageRelease --no-daemon > qa-preview-key-guard.log 2>&1; then
            echo 'Public preview signing key unexpectedly accepted'
            exit 1
          fi
          grep -F 'Preview signing keys are forbidden' qa-preview-key-guard.log
      - run: python3 tools/audit-android-41.py
      - uses: actions/upload-artifact@v4
        with:
          name: watery-water-sort-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/intermediates/merged_manifest/release/**/AndroidManifest.xml
            android/app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml
            android/qa-release-guard.log
            android/qa-signing-guard.log
            android/qa-release.json
            android/qa-preview-key-guard.log
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep two workers per host; distribute the full suite across independent hosts.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/3

  # Preserve the original required-check name and fail closed on any failed shard.
  check:
    if: ${{ always() }}
    needs: [native, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require native and every browser shard
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$BROWSER_RESULT" = success
